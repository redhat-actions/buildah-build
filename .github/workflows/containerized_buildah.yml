# Integration test for the buildah-image input, which runs buildah
# inside a container via podman. This exercises the --root flag and
# storage detection logic from #174 and #176.
name: Build using containerized buildah
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: "hello-world"

jobs:
  build-containerized:
    name: Build image via buildah-image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Buildah action
        uses: actions/checkout@v7
        with:
          path: "buildah-build"

      - name: Create Containerfile
        run: |
          cat > Containerfile<<EOF
          FROM busybox
          RUN echo "hello world"
          EOF

      - name: Build Image
        id: build_image
        uses: ./buildah-build/
        with:
          image: ${{ env.IMAGE_NAME }}
          layers: false
          tags: 'latest ${{ github.sha }}'
          containerfiles: |
            ./Containerfile
          buildah-image: quay.io/buildah/stable

      - name: Echo Outputs
        run: |
          echo "Image: ${{ steps.build_image.outputs.image }}"
          echo "Tags: ${{ steps.build_image.outputs.tags }}"
          echo "Tagged Image: ${{ steps.build_image.outputs.image-with-tag }}"
          echo "Image Digest: ${{ steps.build_image.outputs.digest }}"

      - name: Check images created
        run: buildah images | grep '${{ env.IMAGE_NAME }}'
